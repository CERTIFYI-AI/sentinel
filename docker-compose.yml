version: "3.9"

services:
  sentinel:
    build: .
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - SENTINEL_ENVIRONMENT=production
      - SENTINEL_LOG_LEVEL=INFO
    volumes:
      - sentinel-data:/app/data
      - ./sentinel.yaml:/app/sentinel.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sentinel-data:
