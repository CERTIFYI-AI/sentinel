name = "sentinel"
# Set secrets via: wrangler secret put SUPABASE_URL && wrangler secret put SUPABASE_SERVICE_ROLE_KEY
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom domain for the production app: https://1shield-oss.certifyi.ai
#
# DECLARED IN TWO PLACES ON PURPOSE. The Cloudflare Git build deploys from the
# repository root and reads `wrangler.jsonc` there; this file is the manual
# `wrangler deploy` path run from `dashboard/`. Both target the same Worker, so
# the hostname is stated in both — a config that omits it would drop the domain
# on the next deploy through that path. Keep the two in step.
#
# Declared here rather than clicked once in the Cloudflare dashboard, so the
# hostname is reviewable, diffable and reproducible like everything else in
# this repo — and so a fresh account can be stood up from the tree.
#
# PREREQUISITE: `certifyi.ai` must be a zone on the SAME Cloudflare account
# this Worker deploys to. Cloudflare creates the DNS record and the TLS
# certificate itself for a custom domain; it cannot do that for a zone it does
# not hold. If the zone is absent, `wrangler deploy` fails with a hostname
# error — delete this block to restore the previous behaviour, nothing else
# depends on it.
#
# ADDITIVE, not a cutover: the workers.dev subdomain keeps serving unless it is
# disabled separately, so sentinel.hello-fbb.workers.dev stays reachable and
# existing links do not break the moment this lands.
[[routes]]
pattern = "1shield-oss.certifyi.ai"
custom_domain = true

# Secrets (SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL) must be set via:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# Never put secrets in [vars] — they are committed to source control.
[vars]
NEXT_PUBLIC_SUPABASE_URL = ""
NEXT_PUBLIC_SUPABASE_ANON_KEY = ""

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
# Canonical CSP — keep byte-identical with public/_headers and nginx.conf.
# script-src carries NO 'unsafe-inline' (that would defeat CSP's core XSS
# defence); 'wasm-unsafe-eval' permits only WebAssembly, not JS eval.
# style-src DOES keep 'unsafe-inline': the dashboard is built on React inline
# `style={}` props (thousands of them), which a nonce/hash policy cannot cover;
# style injection is far lower risk than script injection. See
# docs/security/content-security-policy.md.
Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[env.staging]
name = "sentinel-staging"
vars = {}
# Staging secrets: wrangler secret put SUPABASE_URL --env staging
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env staging
# wrangler secret put NEXT_PUBLIC_SUPABASE_URL --env staging
# wrangler secret put NEXT_PUBLIC_SUPABASE_ANON_KEY --env staging
