[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "certifyi-sentinel"
version = "0.1.0"
description = "Real-time AI reliability and governance middleware"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Certifyi", email = "engineering@certifyi.ai"}]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://certifyi.ai"
Repository = "https://github.com/certifyi-ai/sentinel"
Documentation = "https://github.com/certifyi-ai/sentinel#readme"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx[http2]>=0.27.0",
    "litellm>=1.40.0",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7.0",
    "sentence-transformers>=3.0.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.4.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "prometheus-client>=0.20.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]