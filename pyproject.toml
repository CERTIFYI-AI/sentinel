[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "certifyi-sentinel"
version = "0.1.0"
description = "Real-time AI reliability and governance middleware"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Certifyi", email = "engineering@certifyi.ai"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx[http2]>=0.27.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[project.urls]
Homepage = "https://certifyi.ai"
Repository = "https://github.com/certifyi-ai/sentinel"
Documentation = "https://github.com/certifyi-ai/sentinel#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]