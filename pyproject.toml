[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[project]
name = "sentinel-ai-grc"
version = "0.3.2"
description = "Enterprise AI governance, risk, and compliance platform"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = ["Bhaskar <bhaskar@certifyi.ai>"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
        "email-validator>=2.0.0",
  "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0.0",

    "passlib[bcrypt]>=1.7.0",
    "pydantic-settings>=2.0.0",
    "httpx[http2]>=0.27.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
        "numpy>=1.24.0",
    "litellm>=1.0.0",
        "cryptography>=42.0.0",
            "redis>=5.0.0",
                "python-jose[cryptography]>=3.3.0",
    "asyncpg>=0.29.0",
        "prometheus-client>=0.17.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "aiosqlite>=0.19.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[project.urls]
Homepage = "https://certifyi.ai"
Repository = "https://github.com/certifyi-ai/sentinel"
Documentation = "https://github.com/certifyi-ai/sentinel#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = ["F401", "I001", "B027", "B905", "B008", "B006", "B007", "E501", "E712", "E711", "E741", "C408"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disable_error_code = ["import-untyped", "assignment", "call-arg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
