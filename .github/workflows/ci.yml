#
# WS0.10 — Continuous Integration. Gates every PR on:
#   - typecheck (tsc --noEmit) in dashboard + workers
#   - unit tests (vitest) in dashboard + workers
#   - coverage floor: 70% line, 60% branch (dashboard)
#   - python backend: ruff + pytest (the sentinel package)
#   - secret scanning (Gitleaks)
#   - static security (Semgrep OSS ruleset, baseline mode)
#   - a11y smoke (axe-core via Playwright)
#
# External SaaS (Lighthouse CI, Chromatic) is opt-in via repository
# variables so forks don't fail on missing secrets.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Supersede in-progress runs on the same branch/PR: a new push cancels the
# older run instead of letting both consume Actions minutes to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard deps
        working-directory: dashboard
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: TypeScript check (dashboard)
        working-directory: dashboard
        run: npx tsc --noEmit
      - name: TypeScript check (workers)
        working-directory: workers
        run: ../dashboard/node_modules/.bin/tsc --noEmit -p tsconfig.json

  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - working-directory: dashboard
        run: npm run test:coverage
      - name: Enforce coverage floor
        working-directory: dashboard
        run: node ../scripts/check-coverage.mjs coverage/coverage-summary.json

  test-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - working-directory: workers
        run: npx vitest run

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check sentinel/
      - name: Tests (pytest)
        env:
          SENTINEL_SECRET_KEY: ci-only-signing-key-not-a-real-secret-0000
        run: pytest tests/ -q
      - name: Migration replay check
        run: python3 scripts/check_migration_replay.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks
        # gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for org repos,
        # so the step silently never scanned. The docker CLI is license-free
        # (same invocation as security.yml).
        run: |
          docker run --rm \
            -v "$(pwd):/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --verbose
      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Semgrep OSS (new findings only)
        # Baseline mode: only findings introduced by the change fail the job;
        # the pre-existing backlog is tracked in docs/security/semgrep-backlog.md.
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -m pip install --quiet semgrep
          ARGS="--error --config p/ci --config p/typescript --config p/react --config p/owasp-top-ten --exclude node_modules --exclude dist --exclude *.min.js"
          if [ -n "$BASELINE" ] && git cat-file -e "$BASELINE" 2>/dev/null; then
            semgrep scan $ARGS --baseline-commit "$BASELINE"
          else
            semgrep scan $ARGS
          fi

  a11y-smoke:
    if: ${{ vars.RUN_A11Y == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm ci --legacy-peer-deps
      - working-directory: dashboard
        run: npx playwright install --with-deps
      - working-directory: dashboard
        run: npx playwright test tests-e2e/a11y.spec.ts
