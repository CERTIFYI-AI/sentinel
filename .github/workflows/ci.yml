#
# WS0.10 — Continuous Integration. Gates every PR on:
#   - typecheck (tsc --noEmit) in dashboard + workers
#   - unit tests (vitest) in dashboard + workers
#   - coverage floor: 70% line, 60% branch (dashboard)
#   - secret scanning (Gitleaks)
#   - static security (Semgrep OSS ruleset)
#   - a11y smoke (axe-core via Playwright)
#
# External SaaS (Lighthouse CI, Chromatic) is opt-in via repository
# variables so forks don't fail on missing secrets.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci --legacy-peer-deps
      - name: TypeScript check (dashboard)
        working-directory: dashboard
        run: npx tsc --noEmit
      - name: TypeScript check (workers)
        working-directory: workers
        run: ../dashboard/node_modules/.bin/tsc --noEmit -p tsconfig.json

  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm ci --legacy-peer-deps
      - working-directory: dashboard
        run: npm run test:coverage
      - name: Enforce coverage floor
        working-directory: dashboard
        run: node ../scripts/check-coverage.mjs coverage/coverage-summary.json

  test-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm ci --legacy-peer-deps
      - working-directory: workers
        run: npx vitest run

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep OSS
        uses: returntocorp/semgrep-action@v2
        with:
          config: p/ci p/typescript p/react p/owasp-top-ten

  a11y-smoke:
    if: ${{ vars.RUN_A11Y == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm ci --legacy-peer-deps
      - working-directory: dashboard
        run: npx playwright install --with-deps
      - working-directory: dashboard
        run: npx playwright test tests-e2e/a11y.spec.ts
