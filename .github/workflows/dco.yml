# WS0.6 — DCO Sign-off check. Every commit in every PR must contain a
# matching Signed-off-by line (see CONTRIBUTING.md).
name: DCO

on:
  pull_request:
    branches: [main]

jobs:
  dco:
    name: Verify Signed-off-by on every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check DCO
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MISSING=0
          for sha in $(git rev-list --no-merges "${BASE}..${HEAD}"); do
            author_email=$(git log -1 --format='%ae' "$sha")
            author_name=$(git log -1 --format='%an' "$sha")
            expected="Signed-off-by: ${author_name} <${author_email}>"
            if ! git log -1 --format='%B' "$sha" | grep -Fq "$expected"; then
              echo "::error::Commit $sha missing DCO sign-off for $author_name <$author_email>"
              MISSING=$((MISSING+1))
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::$MISSING commit(s) missing DCO sign-off. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits signed-off."
