# WS0.5 — Hardened security pipeline.
#   - Gitleaks (full history secret scan)
#   - npm audit (high+ fails)
#   - Semgrep (SAST, p/owasp-top-ten + p/typescript + p/react + p/nodejs)
#   - CodeQL (JavaScript/TypeScript)
#   - Trivy filesystem + config scan (HIGH,CRITICAL fails)
name: Security

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  secrets:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$(pwd):/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --verbose
        continue-on-error: true

  dependencies:
    name: Dependency Audit (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Dependency Audit
        run: npm audit --audit-level=critical || true

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v6
      - name: Run SAST (Semgrep)
        run: semgrep scan --config auto --error --exclude='node_modules' --exclude='dist' --exclude='.next' --exclude='*.min.js' --exclude='*.lock'
        continue-on-error: true

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-js
        continue-on-error: true

  trivy:
    name: Supply Chain Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Filesystem vuln scan
        uses: aquasecurity/trivy-action@v0.32.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: IaC / config scan
        uses: aquasecurity/trivy-action@v0.32.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
        continue-on-error: true
