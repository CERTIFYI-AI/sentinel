# Apply database migrations to the live Supabase project.
#
# WHY THIS EXISTS: `deploy-dashboard.yml` ships the frontend on every push to
# main, but nothing applied the schema. So merged work that depended on a
# migration was live in the bundle and absent from the database, and the
# product showed empty catalogues and "column does not exist" errors while the
# repository looked green. Several rounds of "why is this not working?" all
# traced back to the same missing step.
#
# This closes the pipeline: schema first, then the frontend that expects it.
#
# ── One-time setup ──────────────────────────────────────────────────────────
# Add these repository secrets (Settings → Secrets and variables → Actions):
#
#   SUPABASE_ACCESS_TOKEN   Personal access token — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    Project ref (the subdomain of your project URL)
#   SUPABASE_DB_PASSWORD    Database password for that project
#
# Until all three exist the job stops with a clear message rather than failing
# obscurely part-way through.
#
# ── Safety ──────────────────────────────────────────────────────────────────
# `supabase db push` applies only migrations the project has not recorded, in
# filename order. It does not drop or reset anything. Every migration in this
# repo is written idempotent, so a re-run is a no-op.
#
# Runs manually (workflow_dispatch) or on a push to main that changes
# migrations. Manual runs offer a dry run, which lists what WOULD be applied
# and changes nothing — use it first if you are unsure of the project's state.

name: Deploy Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List pending migrations without applying them'
        type: boolean
        default: false

# Never let two pushes apply migrations concurrently — the second would race
# the first mid-apply. Queue instead, and do not cancel a run in progress.
concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Verify required secrets are configured
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=""
          [ -z "$ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$PROJECT_REF" ]  && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$DB_PASSWORD" ]  && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "See the header of .github/workflows/deploy-migrations.yml."
            exit 1
          fi
          echo "All required secrets are present."

      # Cheap gate first: catch an ordering mistake before touching the live
      # database, not after half the migrations have applied.
      - name: Static replay check
        run: python3 scripts/check_migration_replay.py

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: List pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Apply migrations
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      - name: Dry run — nothing applied
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          echo "Dry run: the list above is what a real run would apply. No changes were made."

      - name: Confirm applied state
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Migration state after push:"
          supabase migration list --linked
