# Certifyi Sentinel — Truth Regression Test
# Runs the evaluation suite on model/prompt changes to catch accuracy regressions.
# CI gate: fails if hallucination detection rate drops below 80%.

name: Truth Eval

on:
  push:
    branches: [main]
    paths:
      - 'sentinel/layers/**'
      - 'sentinel/providers/**'
      - 'configs/sentinel.yaml'
      - 'data/**'
  pull_request:
    branches: [main]
    paths:
      - 'sentinel/layers/**'
      - 'sentinel/providers/**'
      - 'configs/sentinel.yaml'
      - 'data/**'
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The truth eval drives the live verification pipeline, which requires an
    # OpenAI key. Steps skip cleanly when the repository secret is not
    # configured (same opt-in convention as the external SaaS jobs in ci.yml).
    env:
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          # spacy is not part of the package deps (the sanitizer treats it as
          # an optional enhancement) — install it explicitly for the eval run.
          pip install spacy
          python -m spacy download en_core_web_lg

      - name: Run truth evaluation
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        env:
          DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel_test
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTINEL_SECRET_KEY: ci-only-signing-key-not-a-real-secret-0000
        run: |
          python scripts/run_eval.py --dataset data/eval_dataset.jsonl
        # Exit code 1 if hallucination detection rate < 80%