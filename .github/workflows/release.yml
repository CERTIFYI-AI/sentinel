# WS0.6 — Automated, signed, SBOM-attached releases.
#
# Triggered on pushes to main after CI gates succeed. Produces:
#   - Semantic version tag (vX.Y.Z) + GitHub Release with generated notes
#     (@semantic-release with Conventional Commits).
#     NOTE: does NOT commit a version/CHANGELOG bump back to main —
#     @semantic-release/git was removed because main is a protected branch
#     (a bot push is rejected with GH006), and CHANGELOG.md is curated by hand
#     in this repo. The git tag is the authoritative version record.
#   - CycloneDX + SPDX SBOMs attached to the release.
#   - Sigstore cosign keyless signatures for each artifact.
#   - SLSA v1 build provenance attestation.
#
# All CI gates in ci.yml and security.yml must have succeeded on the
# merge commit for this workflow to proceed.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Minimal scope: semantic-release only creates the tag + GitHub Release
  # (comment-back and label management are disabled in .releaserc.json), so it
  # needs neither issues nor pull-requests write. id-token/attestations are for
  # keyless cosign signing + build provenance.
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Semantic Release + SBOM + Signing
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'CERTIFYI-AI/sentinel' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, 'chore(release)')
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Package build artifact
        run: |
          mkdir -p artifacts
          VERSION="${GITHUB_SHA::12}"
          tar -C dashboard -czf "artifacts/dashboard-${VERSION}.tar.gz" dist
          ls -la artifacts

      - name: Create sbom directory
        run: mkdir -p sbom

      - name: Generate CycloneDX SBOM
        uses: CycloneDX/gh-node-module-generatebom@27e13c2bf0fae78d66387b35ca9749d8cc853060 # v1
        with:
          path: ./dashboard
          output: sbom/sbom-dashboard.cdx.json
        continue-on-error: true

      - name: Generate SPDX SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./dashboard
          format: spdx-json
          output-file: sbom/sbom-dashboard.spdx.json
        continue-on-error: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        continue-on-error: true

      - name: Sign build artifact (keyless)
        env:
          COSIGN_YES: 'true'
        run: |
          for f in artifacts/*.tar.gz sbom/*.json; do
            [ -f "$f" ] && cosign sign-blob --yes "$f" \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" || true
          done
        continue-on-error: true

      - name: Attest build provenance (SLSA v1)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            artifacts/*.tar.gz
        continue-on-error: true

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release@24 \
            @semantic-release/github@10 \
            @semantic-release/commit-analyzer@12 \
            @semantic-release/release-notes-generator@13 \
            conventional-changelog-conventionalcommits@7

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
