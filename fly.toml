# fly.toml — Sentinel backend (FastAPI API + evidence-sync worker)
#
# WHY THIS EXISTS
# --------------
# The dashboard (Cloudflare Worker) and the database (Supabase) were both
# deployed, but the Python backend never was. The consequence chain:
#
#   * POST /v1/integrations/connect had no host, so a browser could store
#     credentials nowhere and no sync was ever queued;
#   * even with a host, nothing ran `python -m sentinel.integrations.worker`,
#     so queued jobs would sit forever.
#
# This file deploys BOTH halves as one Fly app with two processes off a single
# image, so the loop the migrations and edge functions already assume can
# actually turn:
#
#   web    — the FastAPI app (sentinel.api.main:app), serves /v1/integrations/*
#   worker — the durable sync worker that claims background_jobs and collects
#            evidence from the provider adapters
#
# ── One-time setup (run once, locally, with flyctl authenticated) ───────────
#   fly launch --no-deploy --copy-config --name <your-app-name>   # or keep the name below
#   fly secrets set \
#       SENTINEL_SECRET_KEY="$(openssl rand -hex 32)" \
#       SENTINEL_CREDENTIALS_KEY="$(openssl rand -base64 32)" \
#       DATABASE_URL="postgresql://postgres:<pw>@<host>:5432/postgres" \
#       SENTINEL_DATABASE_URL="postgresql://postgres:<pw>@<host>:5432/postgres"
#   fly deploy
#
# DATABASE_URL and SENTINEL_DATABASE_URL are the SAME service-role Supabase DSN
# (the API's tenant resolver + the integrations _db() read DATABASE_URL/
# SUPABASE_DB_URL; the worker reads SENTINEL_DATABASE_URL). Use the Supabase
# connection-pooler URI. SENTINEL_CREDENTIALS_KEY must be base64 that decodes to
# exactly 32 bytes (AES-256-GCM). Full runbook: docs/ops/backend-deployment.md.
#
# NOTE ON COST/"free": Fly bills allocated machine-time. The `web` machine is
# set to suspend when idle (auto_stop) so it costs almost nothing between
# requests. The `worker` polls continuously and so runs 24/7 at the smallest
# size — a few dollars/month, not truly free. The runbook documents a cheaper
# scheduled-worker alternative if that matters.

app = "certifyi-sentinel"
primary_region = "sin"  # Singapore — nearest Fly region to the Nepal-context data; match to your Supabase region for lowest DB latency.

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "uvicorn sentinel.api.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m sentinel.integrations.worker"

# Public HTTP only for the API. The worker has no inbound surface.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

# Liveness: the API exposes /api/health (health_router) and proxy-style /health.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web"]

# The worker must not auto-stop — it is the poll loop that claims sync jobs.
# It has no http_service, so the Fly proxy never suspends it; it stays up.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
